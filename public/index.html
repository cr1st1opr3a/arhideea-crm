<style>
/* Layout: bară de lucru sus, listă/fișă pe toată lățimea; editorul de ofertă are formular + coloană de calcul lipită în dreapta */
:root{
  --bg:#F2F3F1; --surface:#FFFFFF; --sunk:#E9EBE8; --ink:#1B1E21; --muted:#646B72; --line:#D6D9D5;
  --accent:#1F4E8C; --accent-ink:#FFFFFF; --accent-soft:#E2E9F3;
  --ok:#2C7A4B; --ok-soft:#DDEFE3; --warn:#9A6411; --warn-soft:#F6EBD7; --bad:#B0281F; --bad-soft:#F7DEDB;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-head:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171A; --surface:#1C2024; --sunk:#111416; --ink:#E6E8EA; --muted:#9AA2AA; --line:#2D3338;
  --accent:#86ACE3; --accent-ink:#0E1A2B; --accent-soft:#1F2D42;
  --ok:#73C493; --ok-soft:#1C3326; --warn:#E2B460; --warn-soft:#3A2E17; --bad:#F2877D; --bad-soft:#3D1E1B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171A; --surface:#1C2024; --sunk:#111416; --ink:#E6E8EA; --muted:#9AA2AA; --line:#2D3338;
  --accent:#86ACE3; --accent-ink:#0E1A2B; --accent-soft:#1F2D42;
  --ok:#73C493; --ok-soft:#1C3326; --warn:#E2B460; --warn-soft:#3A2E17; --bad:#F2877D; --bad-soft:#3D1E1B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,th.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-head);font-weight:600;margin:0;text-wrap:balance}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}
.bar{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:28px;height:28px;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--f-num);font-weight:600;font-size:12px;flex:none}
.brand b{font-family:var(--f-head);font-size:17px;letter-spacing:.01em}
.brand small{color:var(--muted);font-size:12px;display:block;line-height:1}
.search{flex:1 1 260px;position:relative;min-width:0}
.search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 28px rgba(0,0,0,.14);max-height:60vh;overflow:auto;z-index:40}
.results .grp{padding:6px 12px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
.results a{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;text-decoration:none;color:inherit;border-top:1px solid var(--line);cursor:pointer}
.results a:hover,.results a:focus{background:var(--accent-soft);outline:none}
.results a span:last-child{color:var(--muted);font-size:12px;text-align:right}
nav.tabs{display:flex;gap:2px;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:10px 14px;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:500}
nav.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);cursor:pointer;white-space:nowrap;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--bad)}
.btn.small{padding:4px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:18px 60px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar h2{font-size:22px;margin-right:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:4px 10px;border-radius:99px;font-size:12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.list{width:100%;border-collapse:collapse;font-size:13px}
[data-kpi]{cursor:pointer;transition:border-color .15s}[data-kpi]:hover{border-color:var(--ink,#555)}[data-kpi].sel{outline:2px solid var(--accent,#2b5a9e);outline-offset:-2px}
table.list th{cursor:pointer;user-select:none;text-align:left;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--sunk);position:sticky;top:0}
table.list td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.list tr.click{cursor:pointer}
table.list tr.click:hover td{background:var(--accent-soft)}
table.list .n{text-align:right;white-space:nowrap}
.sub{color:var(--muted);font-size:12px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.s-trimisă{background:var(--accent-soft);color:var(--accent)}
.pill.s-acceptată,.pill.s-contractată,.pill.s-în\ lucru{background:var(--ok-soft);color:var(--ok)}
.pill.s-finalizată{background:var(--ink);color:var(--surface)}
.pill.s-respinsă{background:var(--bad-soft);color:var(--bad)}
.pill.s-ciornă{background:var(--warn-soft);color:var(--warn)}
.tag{font-family:var(--f-num);font-size:11px;color:var(--muted);border:1px solid var(--line);padding:1px 5px;border-radius:4px}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
/* editor */
.editor{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
@media (max-width:980px){.editor{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px}
.card>summary,.card>.hd{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;font-family:var(--f-head);font-size:16px;font-weight:600}
.card>summary::-webkit-details-marker{display:none}
.card>summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none}
.card[open]>summary::before{transform:rotate(45deg)}
.card>summary .sub{font-family:var(--f-ui);font-weight:400;margin-left:auto}
.card .bd{padding:4px 16px 16px;display:grid;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 12px}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea,.cell input,.cell textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);font-size:14px;min-width:0}
label.f textarea{min-height:90px;resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.seg{display:inline-flex;justify-self:start;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 14px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.rows{overflow-x:auto}
table.ed{border-collapse:collapse;width:100%;min-width:640px}
table.ed th{font-size:11px;font-weight:500;color:var(--muted);text-align:left;padding:4px 4px 6px;letter-spacing:.04em}
table.ed td{padding:3px 4px;vertical-align:top}
table.ed td input,table.ed td textarea{width:100%;padding:6px 7px;border:1px solid var(--line);border-radius:5px;background:var(--bg);min-width:0}
table.ed td textarea{min-height:34px;resize:vertical;font-size:13px}
table.ed td.nn input{font-family:var(--f-num);text-align:right}
table.ed td.calc{font-family:var(--f-num);text-align:right;color:var(--muted);white-space:nowrap;padding-top:9px;font-size:13px}
.x{border:0;background:none;color:var(--muted);cursor:pointer;padding:6px;font-size:16px;line-height:1}
.x:hover{color:var(--bad)}
.check{display:flex;align-items:center;gap:8px;font-size:13px}
.note-box{background:var(--sunk);border-radius:5px;padding:10px 12px;font-family:var(--f-num);font-size:12px;white-space:pre-wrap;max-height:260px;overflow:auto;color:var(--muted)}
aside.sum{position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px);display:grid;gap:12px}
@media (max-width:980px){aside.sum{position:static}}
.sumcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.sumcard h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--f-ui);font-weight:500;margin-bottom:8px}
.big{font-family:var(--f-num);font-size:28px;font-weight:600;letter-spacing:-.01em}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px}
.kv span:nth-child(even){font-family:var(--f-num);text-align:right;white-space:nowrap}
.kv .tot{font-weight:600;border-top:1px solid var(--line);padding-top:5px}
.kv .mut{color:var(--muted)}
.actions{display:grid;gap:8px}
.saved{font-size:12px;color:var(--muted)}
.back{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:500}
.ehead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:14px}
.ehead h2{font-size:24px}
.warnline{font-size:12px;color:var(--warn)}
.badline{font-size:12px;color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:var(--r);z-index:60;font-size:13px;max-width:calc(100% - 32px)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:820px){.split{grid-template-columns:minmax(0,1fr)}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font-family:var(--f-num);font-size:22px;font-weight:600;margin-top:2px}
.kpi.bad .val{color:var(--bad)} .kpi.ok .val{color:var(--ok)}
.loading{padding:40px;text-align:center;color:var(--muted)}
.scanbox{border:1px dashed var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px;background:var(--bg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
.prog{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;min-width:80px}
.prog>i{display:block;height:100%;background:var(--ok)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.alert:first-child{border-top:0}
.alert:hover{background:var(--accent-soft)}
.alert .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--muted)}
.alert.bad .dot{background:var(--bad)} .alert.warn .dot{background:var(--warn)} .alert.ok .dot{background:var(--ok)}
.alert b{font-weight:600}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;font-weight:600;margin-left:6px}
.days{font-family:var(--f-num);font-size:12px;font-weight:600;padding:2px 7px;border-radius:99px;white-space:nowrap}
.days.bad{background:var(--bad-soft);color:var(--bad)} .days.warn{background:var(--warn-soft);color:var(--warn)} .days.ok{background:var(--ok-soft);color:var(--ok)}
.cubox{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px;background:var(--bg)}
.cuhd{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cuhd b{font-family:var(--f-head);font-size:15px}
table.ed td.chk{width:34px;text-align:center;padding-top:9px}
table.ed td.chk input{width:18px;height:18px}
tr.done td input:not([type=checkbox]){color:var(--muted)}
.userbox{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.userbox a{color:var(--accent)}
</style>
</head>
<body>

<header class="top">
  <div class="wrap bar">
    <div class="brand"><div class="mark">AA</div><div><b>Oferte &amp; clienți</b><small>Atelier Arhideea · BIA Oprea</small></div></div>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="Caută client, localitate, obiectiv, nr. ofertă…" autocomplete="off">
      <div class="results" id="results" hidden></div>
    </div>
    <button class="btn primary" id="btnNew">+ Ofertă nouă</button>
    <button class="btn" id="btnExport" title="Descarcă toate datele într-un fișier Excel">Backup Excel</button>
    <div class="userbox"><span id="who"></span><a href="/cdn-cgi/access/logout">Ieșire</a></div>
  </div>
  <div class="wrap"><nav class="tabs" id="tabs">
    <button data-v="panou">Panou<span id="alertBadge"></span></button><button data-v="oferte">Oferte</button><button data-v="cu">CU &amp; avize</button><button data-v="clienti">Clienți</button><button data-v="plati">Plăți</button><button data-v="registru">Registru proiecte</button><button data-v="setari">Setări</button>
  </nav></div>
</header>
<main class="wrap" id="main"><div class="loading">Se încarcă baza de date…</div></main>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/pizzip@3.1.7/dist/pizzip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docxtemplater@3.47.4/build/docxtemplater.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="/logic.js"></script>
<script>
(() => {
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = (s) => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const STATUSES = ['ciornă', 'trimisă', 'acceptată', 'respinsă', 'contractată', 'în lucru', 'finalizată', 'arhivă'];
const S = {
  db: null, dl: null, sample: null, ready: false,
  offers: new Map(), clients: new Map(), payments: new Map(), cu: new Map(), registru: [], settings: {},
  view: 'panou', curId: null, draft: null, clientId: null,
  f: { status: 'toate', tip: 'toate', an: 'toți', sort: 'data' }, regQ: '', clQ: '',
};
const DEF_SETTINGS = {
  semnatura: 'Arh. Cristian Oprea', firmaImplicita: 'bia', tarifArh: 25, tarifRez: 7, tarifInst: 4, costMp: 1200, tarifOrar: 40,
  nextContract: { arhideea: 237, bia: 17 },
  firme: { arhideea: { nume: 'SC ATELIER ARHIDEEA SRL' }, bia: { nume: 'BIA Oprea Cristian Daniel', sediu: '', cif: '', iban: '', banca: '' } },
};
const sett = () => ({ ...DEF_SETTINGS, ...S.settings, firme: { ...DEF_SETTINGS.firme, ...(S.settings.firme || {}) }, nextContract: { ...DEF_SETTINGS.nextContract, ...(S.settings.nextContract || {}) } });
const clean = (o) => JSON.parse(JSON.stringify(o));

function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), ms); }

/* ---------------- DB ---------------- */
const queues = {};
function write(col, id, data) {
  const key = col + '/' + id;
  const run = async () => { if (!S.db) throw new Error('fără bază de date'); await S.db.collection(col).doc(id).set(clean(data)); };
  queues[key] = (queues[key] || Promise.resolve()).then(run, run);
  return queues[key].catch((e) => { toast('Nu am putut salva: ' + (e.message || e.code)); throw e; });
}
function remove(col, id) { return S.db.collection(col).doc(id).delete().catch((e) => toast('Nu am putut șterge: ' + (e.message || e.code))); }

/* ---- server API (Cloudflare Pages Functions + D1 + KV) ---- */
function sessionExpired() {
  if ($('#sessBar')) return;
  const d = document.createElement('div'); d.id = 'sessBar';
  d.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:999;background:#b42318;color:#fff;padding:10px 16px;font-weight:600;text-align:center';
  d.innerHTML = 'Sesiunea a expirat. <button class="btn small" style="margin-left:8px" onclick="location.reload()">Reîncarcă și autentifică-te</button>';
  document.body.appendChild(d);
}
async function api(method, path, body, isForm) {
  const opt = { method, headers: { 'x-crm': '1' }, credentials: 'same-origin' };
  if (body !== undefined) { if (isForm) opt.body = body; else { opt.headers['content-type'] = 'application/json'; opt.body = JSON.stringify(body); } }
  let r;
  try { r = await fetch('/api/' + path, opt); }
  catch (e) {
    // De obicei: sesiunea Cloudflare Access a expirat și cererea a fost redirecționată spre pagina de login.
    let expired = false;
    try { const t = await fetch('/api/me', { credentials: 'same-origin', redirect: 'manual', cache: 'no-store' }); expired = t.type === 'opaqueredirect' || t.status === 401 || t.status === 0; } catch (e2) { expired = true; }
    if (expired) { sessionExpired(); throw new Error('Sesiunea de autentificare a expirat. Reîncarcă pagina, autentifică-te și încearcă din nou.'); }
    throw new Error('Nu am putut contacta serverul (' + e.message + '). Verifică internetul și încearcă din nou.');
  }
  if (r.status === 401 || (r.status === 403 && method === 'GET' && path === 'me')) { location.reload(); throw new Error('Sesiunea a expirat'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || ('HTTP ' + r.status)); e.status = r.status; throw e; }
  return j;
}
function makeDb() {
  const L1 = {}, L2 = {};
  const snapOf = (list) => ({ docs: list.map((d) => { const { id, ...x } = d; return { id, exists: true, data: () => x }; }) });
  async function refreshCol(col) { const list = await api('GET', 'c/' + col); (L1[col] || []).forEach((l) => l.next(snapOf(list))); }
  async function refreshDoc(path) { let d = null; try { d = await api('GET', 'c/' + path); } catch (e) { if (e.status !== 404) throw e; } const { id, ...x } = d || {}; (L2[path] || []).forEach((l) => l.next({ exists: !!d, data: () => x })); }
  const doc = (path) => {
    const [col, id] = path.split('/'); const p = 'c/' + col + '/' + encodeURIComponent(id);
    return {
      set: (d) => api('PUT', p, d), delete: () => api('DELETE', p),
      onSnapshot(next, error) { (L2[path] = L2[path] || []).push({ next, error }); refreshDoc(path).catch((e) => error && error(e)); return () => {}; },

  };

  });
  const refreshAll = () => { Object.keys(L1).forEach((c) => refreshCol(c).catch(() => {})); Object.keys(L2).forEach((p) => refreshDoc(p).catch(() => {})); };

function go(view, id) {

}
function route() {

  else if (h.startsWith('c-') && S.clients.has(h.slice(2))) { S.view = 'client'; S.clientId = h.slice(2); }

}

const yearOf = (o) => (o.data || '').slice(0, 4);
const pill = (s) => `<span class="pill s-${esc(s)}">${esc(s || '—')}</span>`;
const firmaTag = (f) => `<span class="tag">${f === 'arhideea' ? 'SRL' : 'BIA'}</span>`;
const tipLbl = { mp: 'pe mp', ore: 'pe ore', forfetar: 'forfetar' };
function paidFor(filter) { let s = 0; S.payments.forEach((p) => { if (filter(p)) s += L.n(p.sumaEur); }); return s; }
const dueOffer = (o) => { if (o.contract?.istoric) return 0; if (o.anexa && ['respinsă', 'ciornă'].includes(o.status)) return 0; return L.arhFinal(o); };
/* progres realizat (%), din care rezultă suma exigibilă acum */
const progOf = (o) => (o.progres !== undefined && o.progres !== null && o.progres !== '') ? Math.max(0, Math.min(100, L.n(o.progres))) : (o.anexa ? 100 : null);
function fin(o) {
  const contr = L.esteContractata(o) && !o.contract?.istoric;
  const due = contr ? dueOffer(o) : 0;
  const paid = paidFor((p) => p.offerId === o.id);
  const pr = contr ? progOf(o) : null;
  const earned = pr == null ? 0 : due * pr / 100;
  return { contr, due, paid, pr, earned, now: Math.max(0, earned - paid), rest: due - paid };
}
function phasesOf(o) {
  const et = (o.etape || []).filter((e) => L.n(e.pct) > 0);
  return et.length ? et.map((e) => ({ den: e.den, pct: L.n(e.pct), cond: e.cond || '' })) : [{ den: o.anexa ? ('Anexa ' + String(o.anexa.nr).padStart(2, '0') + (o.anexa.obiect ? ' – ' + o.anexa.obiect : '')) : (o.obiectiv || 'Onorariu'), pct: 100, cond: '' }];
}

}

  <div class="grid">

function clientHint() {
  const box = $('#clHint'); const d = S.draft; if (!box || !d) return;
  const name = (d.clientNume || '').trim();
  const linked = d.clientId && S.clients.get(d.clientId);
  if (linked && norm(linked.nume).trim() === norm(name)) { box.innerHTML = `✓ legat de clientul <a href="#c-${linked.id}">${esc(linked.nume)}</a>`; return; }
  if (!name) { box.innerHTML = 'Scrie numele și alege clientul din listă.'; return; }
  const probe = { nume: name };
  const sim = [...S.clients.values()].filter((c) => norm(c.nume).includes(norm(name)) || sameClient(probe, c)).slice(0, 4);
  const regs = S.registru.filter((r, i, arr) => sameClient(probe, { nume: r.beneficiar }) && arr.findIndex((x) => norm(x.beneficiar) === norm(r.beneficiar)) === i && !sim.some((c) => norm(c.nume) === norm(r.beneficiar))).slice(0, 2);
  box.innerHTML = `<span style="color:var(--warn,#b7791f)">Nelegat de un client.</span> `
    + sim.map((c) => `<button class="btn small" data-uscl="${c.id}">Folosește „${esc(c.nume)}”</button>`).join(' ')
    + regs.map((r, i) => ` <button class="btn small" data-regcl="${i}" title="Din registrul de proiecte, ${esc(r.nrProiect || '')}">Din registru: „${esc(r.beneficiar)}”</button>`).join('')
    + ` <button class="btn small primary" data-newcl="1">+ Client nou „${esc(name)}”</button>`;
  box.onclick = (e) => {
    const b = e.target.closest('button'); if (!b) return; e.preventDefault(); e.stopPropagation();
    let c;
    if (b.dataset.uscl) c = S.clients.get(b.dataset.uscl);
    else { const r = b.dataset.regcl != null ? regs[+b.dataset.regcl] : null; c = { id: L.uid('c_'), nume: r ? r.beneficiar : name, tip: /\b(srl|sa|s\.r\.l)\b/i.test(r ? r.beneficiar : name) ? 'PJ' : 'PF', localitate: d.localitate || (r ? r.adresa : '') || '', adresa: '', tel: '', email: '', note: '', sursa: r ? 'registru' : 'app' }; S.clients.set(c.id, c); write('clients', c.id, c); toast('Client creat: ' + c.nume); }
    d.clientId = c.id; d.clientNume = c.nume; const i = $('[data-p="clientNume"]'); if (i) i.value = c.nume; title(); scheduleSave(); clientHint();
  };
}
function bindForm() {
  const f = $('#form');
  f.oninput = (e) => {
    const el = e.target; const p = el.dataset.p; if (!p) return;
    let v = el.value; if (el.dataset.num) v = L.n(v);
    if (p.startsWith('contract.regim.')) { S.draft.contract.regim = S.draft.contract.regim || {}; S.draft.contract.regim[p.slice(15).replace(/·/g, '.')] = v; }
    else setPath(S.draft, p, v);
    if (p === 'clientNume' || p === 'localitate') title();
    if (p === 'clientNume') { clearTimeout(S.hintT); S.hintT = setTimeout(clientHint, 250); }
    if (p === 'data' && S.draft.sursa !== 'excel') { S.draft.nr = L.nrInreg(v, seqFor(v, S.draft.id)); const n = $('#i-nr'); if (n) n.value = S.draft.nr; }
    liveCalc(); scheduleSave();
  };
  f.onchange = (e) => {
    const el = e.target;
    if (el.dataset.c) { setPath(S.draft, el.dataset.c, el.checked); if (el.dataset.c === 'existent' || el.dataset.c === 'contract.dinFinal') renderForm(); liveCalc(); scheduleSave(); }
    if (el.dataset.p === 'firma') { S.draft.tva.arh = el.value === 'arhideea'; renderForm(); renderSummary(); scheduleSave(); }
    if (el.dataset.p === 'contract.ben.tip' || el.dataset.p === 'moneda') { renderForm(); renderSummary(); scheduleSave(); }
    if (el.dataset.p === 'status') renderSummary();
  };
  f.onclick = async (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const d = S.draft;
    if (b.dataset.tip) { if (d.tip === b.dataset.tip) return; d.tip = b.dataset.tip; if (!d.ore?.length) d.ore = L.ofertaNoua(sett(), 'ore').ore; if (!d.forfetar?.length) d.forfetar = L.ofertaNoua(sett(), 'forfetar').forfetar; renderForm(); renderSummary(); scheduleSave(); return; }
    if (b.dataset.add) { const p = b.dataset.add; const arr = getPath(d, p) || []; const proto = { zone: { den: 'Zona ' + (arr.length + 1), mp: 0, arh: sett().tarifArh, rel: 0, exp: 0, rez: sett().tarifRez, inst: sett().tarifInst, cost: sett().costMp }, 'final.zone': { den: 'Zona ' + (arr.length + 1), mp: 0, arh: sett().tarifArh, rel: 0, exp: 0, rez: 0, inst: 0, cost: 0 }, ore: { den: '', ore: 0, tarif: sett().tarifOrar }, forfetar: { den: '', desc: '', cost: 0, durata: '' }, etape: { den: '', desc: '', pct: 0, cond: '', durata: '' } }[p]; arr.push(proto); setPath(d, p, arr); renderForm(); renderSummary(); scheduleSave(); return; }
    if (b.dataset.del) { const ks = b.dataset.del.split('.'); const i = +ks.pop(); getPath(d, ks.join('.')).splice(i, 1); renderForm(); renderSummary(); scheduleSave(); return; }
    if (b.id === 'reNr') { d.nr = L.nrInreg(d.data, seqFor(d.data, d.id)); renderForm(); scheduleSave(); return; }
    if (b.id === 'etStd') { d.etape = clean(d.tip === 'mp' ? L.DEF.etapeMp : L.DEF.etapeAlte); renderForm(); scheduleSave(); return; }
    if (b.id === 'txtStd') { const n = L.ofertaNoua(sett(), d.tip); d.note = n.note; d.excluse = n.excluse; d.plata = n.plata; renderForm(); scheduleSave(); toast('Am repus textele standard'); return; }
    if (b.id === 'finStart') { d.final = { zone: clean(d.zone), data: L.ofertaNoua(sett()).data, note: '' }; if (!['contractată', 'în lucru'].includes(d.status)) {} renderForm(); renderSummary(); scheduleSave(); return; }
    if (b.id === 'finDel') { if (b.dataset.sure) { d.final = null; renderForm(); renderSummary(); scheduleSave(); } else { b.dataset.sure = 1; b.textContent = 'Sigur? Apasă din nou'; } return; }
    if (b.id === 'toCtr') { d.contract = { nr: '', data: L.ofertaNoua(sett()).data, ben: { tip: 'PF', nume: d.clientNume }, investitie: '', amplasament: '', cf: '', nrCad: '', regim: {} }; const c = S.clients.get(d.clientId); if (c) Object.assign(d.contract.ben, { tel: c.tel || '', email: c.email || '', domiciliu: c.adresa || '', cnp: c.cnp || '', ciSerie: c.ciSerie || '', ciNr: c.ciNr || '' }); renderForm(); scheduleSave(); return; }
    if (b.id === 'ctrNr') { d.contract.nr = String(sett().nextContract[d.firma]); renderForm(); scheduleSave(); return; }
    if (b.id === 'ctrDel') { if (b.dataset.sure) { d.contract = null; renderForm(); renderSummary(); scheduleSave(); } else { b.dataset.sure = 1; b.textContent = 'Sigur? Apasă din nou'; } return; }
    if (b.id === 'dlCtr') { await downloadContract(); return; }
    if (b.id === 'dlAnx') { flushSave(); try { const c = S.clients.get(d.clientId) || {}; const blob = await renderDocx('anexa', L.dataAnexa(d, c)); await save(fileSafe(`Anexa ${String(d.anexa.nr).padStart(2, '0')} contract cadru ${c.cadru?.nr || ''} ${d.clientNume}`) + '.docx', blob); } catch (er) { toast('Eroare la generarea anexei: ' + er.message, 5000); } return; }
    if (b.id === 'scanGo') { await scanDocs(); return; }
  };
}

function liveCalc() {
  const d = S.draft; const t = L.totals(d);
  $$('[data-z]').forEach((el) => { const z = getPath(d, el.dataset.z); if (z) el.textContent = L.eur(L.n(z.mp) * (L.n(z.arh) + L.n(z.rel))); });
  $$('[data-o]').forEach((el) => { const r = d.ore[+el.dataset.o]; if (r) el.textContent = L.eur(L.n(r.ore) * L.n(r.tarif)); });
  $$('[data-et]').forEach((el) => { const e = d.etape[+el.dataset.et]; if (e) el.textContent = L.eur(t.prestator * L.n(e.pct) / 100); });
  renderSummary();
}

function renderSummary() {
  const d = S.draft; if (!d) return; const t = L.totals(d);
  const fz = d.tip === 'mp' && d.final ? L.calcZone(d.final.zone, d.tva, d.cotaTva) : null;
  const paid = paidFor((p) => p.offerId === d.id);
  const contr = L.esteContractata(d);
  const due = contr ? dueOffer(d) : 0;
  const cuTva = d.firma === 'arhideea' && d.tva?.arh;
  const sumPct = (d.etape || []).reduce((s, e) => s + L.n(e.pct), 0);
  $('#sum').innerHTML = `
  <div class="sumcard"><h3>Onorariu arhitectură${t.rel ? ' + releveu' : ''}</h3>
    <div class="big">${L.eur(t.prestator)}</div>
    <div class="sub">${cuTva ? L.eur(t.prestatorTva) + ' cu TVA' : 'fără TVA (BIA)'}${t.inv && d.tip === 'mp' ? ' · ' + L.pct(t.prestator / t.inv) + ' din investiție' : ''}</div>
  </div>
  ${d.tip === 'mp' ? `<div class="sumcard"><h3>Ofertă completă</h3><div class="kv">
    <span>Suprafață</span><span>${L.fmt(t.mp)} mp</span>
    <span>Arhitectură</span><span>${L.eur(t.arh)}</span>
    ${t.rel ? `<span>Releveu</span><span>${L.eur(t.rel)}</span>` : ''}
    ${t.exp ? `<span class="mut">Expertiză (colab.)</span><span>${L.eur(t.exp)}</span>` : ''}
    <span class="mut">Rezistență (colab.)</span><span>${L.eur(t.rez)}</span>
    <span class="mut">Instalații (colab.)</span><span>${L.eur(t.inst)}</span>
    <span class="tot">Total fără TVA</span><span class="tot">${L.eur(t.total)}</span>
    <span>Cu TVA unde se aplică</span><span>${L.eur(t.totalTva)}</span>
    <span class="mut">Investiție estimată</span><span>${t.inv ? L.eur(t.inv) : '—'}</span>
  </div></div>` : `<div class="sumcard"><h3>${d.tip === 'ore' ? 'Estimare ore' : 'Total livrabile'}</h3><div class="kv">${d.tip === 'ore' ? `<span>Ore estimate</span><span>${L.fmt(t.ore)}</span>` : ''}<span class="tot">Total fără TVA</span><span class="tot">${L.eur(t.total)}</span>${cuTva ? `<span>Cu TVA</span><span>${L.eur(t.totalTva)}</span>` : ''}</div></div>`}
  ${fz ? `<div class="sumcard"><h3>Final vs ofertat</h3><div class="kv"><span>Suprafață reală</span><span>${L.fmt(fz.mp)} mp</span><span>Arh. final</span><span>${L.eur(fz.prestator)}</span><span class="mut">Diferență</span><span style="color:${fz.prestator >= t.prestator ? 'var(--ok)' : 'var(--bad)'}">${(fz.prestator >= t.prestator ? '+' : '') + L.eur(fz.prestator - t.prestator)}</span></div></div>` : ''}
  <div class="sumcard"><h3>Încasări</h3>${(() => { const f = fin(d); const ph = phasesOf(d); let cum = 0; const chips = ph.map((e) => { cum += e.pct; return { lbl: e.den.split(' (')[0].slice(0, 28), v: Math.round(cum * 100) / 100 }; });
      if (!f.contr) return '<div class="sub">Oferta nu e încă contractată (sau e marcată contract vechi); soldul pornește de la contract.</div>' + `<div class="kv" style="margin-top:6px"><span>Încasat</span><span>${L.eur(f.paid)}</span></div>`;
      return `<div class="sub" style="margin-bottom:6px">Cât din proiect e realizat? Suma exigibilă se calculează din fazele contractului.</div>

const tplCache = {};
async function tpl(name) { if (!tplCache[name]) { const r = await fetch('tpl/' + name + '.json'); if (!r.ok) throw new Error('șablonul ' + name + ' lipsește'); const j = await r.json(); const bin = atob(j.b64); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); tplCache[name] = u.buffer; } return tplCache[name]; }
async function renderDocx(name, data) {
  const zip = new PizZip(await tpl(name));
  const doc = new window.docxtemplater(zip, { paragraphLoop: true, linebreaks: true, nullGetter: () => '' });
  doc.render(data);
  return doc.getZip().generate({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}
async function save(filename, blob) {
  if (!S.dl) { toast('Descărcarea nu e disponibilă în această vizualizare'); return false; }
  try { const r = await S.dl.save({ filename, data: blob }); if (r === 'saved' || r?.status === 'saved' || r) toast('Fișier pregătit: ' + filename); return true; }
  catch (e) { if (e?.code !== 'declined' && e?.code !== 'cancelled') toast('Nu am putut salva fișierul: ' + (e.message || e.code)); return false; }
}
const fileSafe = (s) => String(s || '').replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim();
async function downloadOffer() {
  flushSave();
  try {
    const d = S.draft;
    const blob = await renderDocx('oferta', L.dataOferta(d, sett()));

    if (ok && d.status === 'ciornă') { d.status = 'trimisă'; scheduleSave(); renderForm(); renderSummary(); }
  } catch (e) { toast('Eroare la generarea ofertei: ' + e.message, 5000); console.error(e); }
}
async function downloadContract() {
  const d = S.draft;
  if (!d.contract.nr) { const s = sett(); d.contract.nr = String(s.nextContract[d.firma]); }
  const s = sett(); const nrv = parseInt(d.contract.nr, 10);
  if (nrv && nrv >= s.nextContract[d.firma]) { const ns = clean(S.settings); ns.nextContract = { ...s.nextContract, [d.firma]: nrv + 1 }; S.settings = ns; write('settings', 'main', ns); }
  if (!['în lucru', 'finalizată'].includes(d.status)) d.status = 'contractată';
  // păstrează datele de contact pe fișa clientului
  const c = S.clients.get(d.clientId); const b = d.contract.ben || {};
  if (c) { const nc = { ...c }; ['tel', 'email', 'cnp', 'ciSerie', 'ciNr'].forEach((k) => { if (b[k] && !nc[k]) nc[k] = b[k]; }); if (b.domiciliu && !nc.adresa) nc.adresa = b.domiciliu; if (b.tip) nc.tip = b.tip; if (JSON.stringify(nc) !== JSON.stringify(c)) { S.clients.set(c.id, nc); write('clients', c.id, nc); } }
  flushSave(); renderForm(); renderSummary();
  try {
    const blob = await renderDocx('contract', L.dataContract(d, sett()));
    await save(fileSafe(`Contract proiectare ${d.clientNume} ${d.localitate}`) + '.docx', blob);
  } catch (e) { toast('Eroare la generarea contractului: ' + e.message, 5000); console.error(e); }
}

async function pdfToImages(file) {
  const lib = window.pdfjsLib; if (!lib) throw new Error('nu pot citi PDF aici');
  if (!window.pdfjsWorker) await new Promise((ok, ko) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; sc.onload = ok; sc.onerror = () => ko(new Error('nu am putut încărca cititorul PDF')); document.head.appendChild(sc); });
  const pdf = await lib.getDocument({ data: await file.arrayBuffer(), isEvalSupported: false }).promise;
  const out = [];
  for (let i = 1; i <= Math.min(pdf.numPages, 3); i++) {
    const page = await pdf.getPage(i); const vp = page.getViewport({ scale: 1.6 });
    const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
    await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
    out.push(await new Promise((r) => cv.toBlob(r, 'image/jpeg', 0.85)));
  }
  return out;
}

function clientStats(c) {
  const offers = [...S.offers.values()].filter((o) => o.clientId === c.id);
  const contracted = offers.filter(L.esteContractata);
  const due = contracted.reduce((s, o) => s + dueOffer(o), 0);
  const paid = paidFor((p) => p.clientId === c.id);
  const fs = offers.map(fin);
  const earned = fs.reduce((s, f) => s + f.earned, 0);
  const paidTracked = fs.filter((f) => f.contr).reduce((s, f) => s + f.paid, 0);
  const now = fs.reduce((s, f) => s + f.now, 0);
  const tracked = fs.reduce((s, f) => s + f.due, 0);
  return { offers, contracted, due, paid, rest: tracked - paidTracked, earned, now, tracked };
}

const regCache = new Map();
function regClient(r) {
  const k = r.beneficiar; if (regCache.has(k) && S.clients.has(regCache.get(k))) return S.clients.get(regCache.get(k));
  const nt = nameToks(r.beneficiar); let best = null;
  for (const c of S.clients.values()) {
    const ct = nameToks(c.nume || ''); if (!ct.length || !nt.length) continue;
    const eq = ct.length === nt.length && ct.every((w) => nt.some((v) => tokEq(w, v)));
    if (eq) { best = c; break; }
    if (!best && sameClient({ nume: r.beneficiar }, c)) best = c;
  }
  regCache.set(k, best ? best.id : null); return best;
}

/* ---------------- CU & AVIZE ---------------- */
const AVIZE_STD = ['Alimentare cu apă', 'Canalizare', 'Alimentare cu energie electrică', 'Gaze naturale', 'Telefonizare', 'Salubritate', 'Securitate la incendiu (ISU)', 'Protecția civilă', 'Sănătatea populației (DSP)', 'Act administrativ / punct de vedere mediu (APM)', 'Direcția Județeană pentru Cultură', 'Studiu geotehnic', 'Ridicare topografică vizată OCPI', 'Aviz administrator drum', 'Aviz gospodărirea apelor', 'Extras de carte funciară actualizat'];
const todayIso = () => L.ofertaNoua(sett()).data;
function addMonths(iso, m) { if (!iso || !L.n(m)) return ''; const [y, mo, d] = iso.split('-').map(Number); const dt = new Date(Date.UTC(y, mo - 1 + L.n(m), d)); return dt.toISOString().slice(0, 10); }
const cuExp0 = (c) => c.dataExpirare || addMonths(c.dataEmitere, c.valabilitateLuni);
/* valabilitatea curentă: ultima prelungire (dacă există) */
const plEnd = (c, i) => { const p = c.prelungiri[i]; if (p.panaLa) return p.panaLa; const prev = i ? plEnd(c, i - 1) : cuExp0(c); return addMonths(prev, p.luni); };
const cuExp = (c) => (c.prelungiri && c.prelungiri.length) ? (plEnd(c, c.prelungiri.length - 1) || cuExp0(c)) : cuExp0(c);
const daysTo = (iso) => iso ? Math.round((Date.parse(iso + 'T00:00:00Z') - Date.parse(todayIso() + 'T00:00:00Z')) / 86400000) : null;
function daysPill(iso) { const d = daysTo(iso); if (d == null) return '<span class="sub">fără dată</span>'; const cls = d < 0 ? 'bad' : d <= 30 ? 'bad' : d <= 60 ? 'warn' : 'ok'; return `<span class="days ${cls}">${d < 0 ? 'expirat de ' + -d + ' zile' : d === 0 ? 'expiră azi' : 'încă ' + d + ' zile'}</span>`; }
function cuFor(offerId) { return [...S.cu.values()].filter((c) => c.offerId === offerId).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)); }
const avStat = (c) => { const a = c.avize || []; const ok = a.filter((x) => x.obtinut).length; return { tot: a.length, ok, lipsa: a.filter((x) => !x.obtinut) }; };
const cuTimers = {};
function saveCu(c) { S.cu.set(c.id, c); clearTimeout(cuTimers[c.id]); cuTimers[c.id] = setTimeout(() => write('cu', c.id, c), 700); updateBadge(); }

const CU_PROMPT = `Documentul atașat este un Certificat de urbanism (CU) emis în România. Extrage datele în acest format JSON:
{"nr":"numărul certificatului","dataEmitere":"AAAA-LL-ZZ","valabilitateLuni":număr de luni de valabilitate (convertește din zile/ani dacă e cazul),"dataExpirare":"AAAA-LL-ZZ doar dacă e scrisă explicit, altfel șir gol","emitent":"autoritatea emitentă","solicitant":"","scop":"scopul emiterii / denumirea lucrării","amplasament":"adresa imobilului","cf":"număr carte funciară","nrCad":"număr cadastral sau topografic","regim":"pe scurt, regimul tehnic relevant (POT, CUT, regim de înălțime, retrageri) într-un rând","avize":[{"den":"denumirea avizului / acordului / studiului cerut","categorie":"utilități | mediu | securitate și sănătate | cultură | alte avize | studii | documente"}]}
În "avize" pune TOATE avizele și acordurile bifate sau cerute (utilități: apă, canalizare, energie electrică, gaze, telefonizare, salubritate; securitate la incendiu, protecție civilă, sănătatea populației; actul autorității de mediu; avize/acorduri specifice; studii de specialitate precum studiu geotehnic, ridicare topografică vizată OCPI; alte documente cerute pentru autorizare). Nu include taxe și nu include elemente nebifate. Pune doar ce scrie în document.`;

async function uploadFile(file) {
  const fd = new FormData(); fd.append('file', file);
  return api('POST', 'files', fd, true);
}

  const box = $('#cuBody'); if (!box || !S.draft) return;
  const d = S.draft; const list = cuFor(d.id);
  const sum = list[0] ? (() => { const st = avStat(list[0]); return `CU ${esc(list[0].nr || '')} · ${st.ok}/${st.tot} avize`; })() : '';
  $('#cuSum').textContent = sum;
  box.innerHTML = `
  <div class="scanbox"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b style="font-size:13px">Încarcă un certificat de urbanism</b><span class="sub">PDF sau poză; citesc numărul, valabilitatea și avizele cerute</span></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input type="file" id="cuFile" accept="application/pdf,image/*"><button class="btn small primary" id="cuUp">Încarcă și citește</button><button class="btn small" id="cuManual">Adaugă CU fără fișier</button><span class="sub" id="cuMsg"></span></div></div>
  ${list.map((c) => cuEditor(c)).join('')}`;
  bindCu(box);
}

      <span style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap">${c.fileKey ? `<a class="btn small" href="/api/files/${encodeURIComponent(c.fileKey)}" target="_blank" rel="noopener">Deschide ${esc(c.fileName || 'fișierul')}</a><button class="btn small" data-cuai="${c.id}">Recitește</button>` : ''}<button class="btn small" data-cuctr="${c.id}">Preia în contract</button><button class="btn small danger" data-cudel="${c.id}">Șterge</button></span></div>
    <div class="grid">${f('nr', 'Nr. CU')}${f('dataEmitere', 'Emis la', 'date')}${f('valabilitateLuni', 'Valabil (luni)')}${field('Expiră la' + (c.prelungiri?.length ? ' (inițial)' : c.dataExpirare ? '' : ' (calculat)'), `<input data-cf="dataExpirare" data-cu="${c.id}" type="date" value="${esc(cuExp0(c))}">`)}${f('emitent', 'Emitent')}</div>
    ${plBlock(c)}
    <div class="grid">${f('scop', 'Scop / denumirea lucrării')}${f('amplasament', 'Amplasament')}${f('cf', 'Nr. CF')}${f('nrCad', 'Nr. cadastral')}</div>
    ${c.regim ? `<div class="sub">Regim: ${esc(c.regim)}</div>` : ''}
    <div class="prog"><i style="width:${st.tot ? Math.round(st.ok / st.tot * 100) : 0}%"></i></div>
    <div class="rows"><table class="ed"><thead><tr><th></th><th>Aviz / acord / studiu</th><th style="width:140px">Obținut la</th><th style="width:120px">Nr.</th><th>Observații</th><th></th></tr></thead><tbody>
      ${(c.avize || []).map((a, i) => `<tr class="${a.obtinut ? 'done' : ''}"><td class="chk"><input type="checkbox" data-av="${c.id}" data-i="${i}" data-k="obtinut" ${a.obtinut ? 'checked' : ''} title="Obținut"></td><td><input data-av="${c.id}" data-i="${i}" data-k="den" value="${esc(a.den)}"></td><td><input type="date" data-av="${c.id}" data-i="${i}" data-k="data" value="${esc(a.data || '')}"></td><td><input data-av="${c.id}" data-i="${i}" data-k="nr" value="${esc(a.nr || '')}"></td><td><input data-av="${c.id}" data-i="${i}" data-k="note" value="${esc(a.note || '')}" placeholder="${esc(a.categorie || '')}"></td><td><button class="x" data-avdel="${c.id}" data-i="${i}" title="Șterge">×</button></td></tr>`).join('')}
    </tbody></table></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn small" data-avadd="${c.id}">+ Aviz</button><select class="btn small" data-avstd="${c.id}"><option value="">+ din lista uzuală…</option>${AVIZE_STD.map((x) => `<option>${esc(x)}</option>`).join('')}</select></div>
    ${field('Note CU (prelungire, depuneri etc.)', `<textarea data-cf="note" data-cu="${c.id}" rows="2">${esc(c.note || '')}</textarea>`)}
  </div>`;
}
function plBlock(c) {
  const pl = c.prelungiri || [];
  const pf = (i, k, type, w) => `<input data-pl="${c.id}" data-i="${i}" data-k="${k}" ${type ? `type="${type}"` : ''} style="${w ? 'width:' + w : ''}" value="${esc(pl[i][k] ?? '')}">`;
  return `<div style="margin:4px 0 10px">
    ${pl.length ? `<div class="rows"><table class="ed"><thead><tr><th>Prelungire</th><th style="width:150px">Prelungit la</th><th style="width:90px">Cu (luni)</th><th style="width:160px">Valabil până la</th><th>Act / document</th><th></th></tr></thead><tbody>
      ${pl.map((p, i) => `<tr><td class="sub">${i + 1}</td><td>${pf(i, 'data', 'date')}</td><td>${pf(i, 'luni', '', '70px')}</td><td><input data-pl="${c.id}" data-i="${i}" data-k="panaLa" type="date" value="${esc(plEnd(c, i))}" title="Calculat din valabilitatea anterioară + luni; îl poți corecta"></td>
        <td>${p.fileKey ? `<a href="/api/files/${encodeURIComponent(p.fileKey)}" target="_blank" rel="noopener">${esc(p.fileName || 'fișier')}</a>` : `<label class="btn small" style="cursor:pointer">Atașează (fără citire AI)<input type="file" data-plfile="${c.id}" data-i="${i}" accept="application/pdf,image/*" style="display:none"></label>`} ${pf(i, 'nr', '', '110px').replace('<input', '<input placeholder="nr. / observații"')}</td>
        <td><button class="x" data-pldel="${c.id}" data-i="${i}" title="Șterge prelungirea">×</button></td></tr>`).join('')}
    </tbody></table></div>` : ''}
    <button class="btn small" data-pladd="${c.id}">↻ CU prelungit</button> <span class="sub">${pl.length ? 'Valabilitatea și alertele din panou folosesc ultima prelungire.' : 'Bifezi prelungirea fără să reîncarci CU-ul; avizele rămân aceleași.'}</span>
  </div>`;
}
function bindCu(box) {
  box.oninput = (e) => {
    e.stopPropagation(); const el = e.target;
    if (el.dataset.cf) { const c = S.cu.get(el.dataset.cu); if (!c) return; let v = el.value; if (el.dataset.cf === 'valabilitateLuni') v = L.n(v); c[el.dataset.cf] = v; if (el.dataset.cf === 'valabilitateLuni' || el.dataset.cf === 'dataEmitere') { if (c._expAuto !== false) c.dataExpirare = ''; } if (el.dataset.cf === 'dataExpirare') c._expAuto = false; saveCu(c); }
    if (el.dataset.av && el.type !== 'checkbox') { const c = S.cu.get(el.dataset.av); c.avize[+el.dataset.i][el.dataset.k] = el.value; saveCu(c); }
    if (el.dataset.pl) { const c = S.cu.get(el.dataset.pl); const p = c.prelungiri[+el.dataset.i]; const k = el.dataset.k; p[k] = k === 'luni' ? L.n(el.value) : el.value; if (k === 'luni') p.panaLa = ''; saveCu(c); }
  };
  box.onchange = (e) => {
    e.stopPropagation(); const el = e.target;
    if (el.dataset.av && el.type === 'checkbox') { const c = S.cu.get(el.dataset.av); const a = c.avize[+el.dataset.i]; a.obtinut = el.checked; if (el.checked && !a.data) a.data = todayIso(); saveCu(c); renderCuCard(); }
    if (el.dataset.avstd && el.value) { const c = S.cu.get(el.dataset.avstd); c.avize = c.avize || []; c.avize.push({ den: el.value, obtinut: false }); saveCu(c); renderCuCard(); }
    if (el.dataset.cf === 'dataEmitere' || el.dataset.cf === 'valabilitateLuni' || el.dataset.cf === 'dataExpirare') renderCuCard();
    if (el.dataset.pl && el.dataset.k !== 'nr') renderCuCard();
    if (el.dataset.plfile && el.files[0]) { const c = S.cu.get(el.dataset.plfile); const p = c.prelungiri[+el.dataset.i]; $('#cuMsg').textContent = 'Încarc actul de prelungire…'; uploadFile(el.files[0]).then((up) => { p.fileKey = up.key; p.fileName = up.name; saveCu(c); $('#cuMsg').textContent = ''; renderCuCard(); }).catch((er) => { $('#cuMsg').textContent = 'Nu am reușit: ' + er.message; }); }
  };
  box.onclick = async (e) => {
    const b = e.target.closest('button'); if (!b) return; e.stopPropagation();
    const d = S.draft;
    if (b.id === 'cuManual') { const c = { id: L.uid('u_'), offerId: d.id, clientId: d.clientId, nr: '', dataEmitere: '', valabilitateLuni: 12, avize: [], createdAt: Date.now() }; saveCu(c); write('cu', c.id, c); renderCuCard(); return; }
    if (b.id === 'cuUp') {
      const file = $('#cuFile').files[0]; const msg = $('#cuMsg');
      if (!file) { msg.textContent = 'Alege întâi fișierul.'; return; }
      b.disabled = true; msg.textContent = 'Încarc fișierul…';
      try {
        const up = await uploadFile(file);
        const c = { id: L.uid('u_'), offerId: d.id, clientId: d.clientId, fileKey: up.key, fileName: up.name, avize: [], createdAt: Date.now() };
        S.cu.set(c.id, c); await write('cu', c.id, c); renderCuCard();
        await readCu(c, $('#cuMsg'));
      } catch (er) { msg.textContent = 'Nu am reușit: ' + er.message; }
      b.disabled = false; return;
    }
    if (b.dataset.cuai) { await readCu(S.cu.get(b.dataset.cuai), $('#cuMsg')); return; }
    if (b.dataset.pladd) { const c = S.cu.get(b.dataset.pladd); c.prelungiri = c.prelungiri || []; c.prelungiri.push({ data: todayIso(), luni: 12, panaLa: '', nr: '' }); saveCu(c); renderCuCard(); updateBadge(); return; }
    if (b.dataset.pldel) { const c = S.cu.get(b.dataset.pldel); const p = c.prelungiri.splice(+b.dataset.i, 1)[0]; if (p?.fileKey) api('DELETE', 'files/' + encodeURIComponent(p.fileKey)).catch(() => {}); saveCu(c); renderCuCard(); updateBadge(); return; }
    if (b.dataset.avadd) { const c = S.cu.get(b.dataset.avadd); c.avize = c.avize || []; c.avize.push({ den: '', obtinut: false }); saveCu(c); renderCuCard(); return; }
    if (b.dataset.avdel) { const c = S.cu.get(b.dataset.avdel); c.avize.splice(+b.dataset.i, 1); saveCu(c); renderCuCard(); return; }
    if (b.dataset.cuctr) {
      const c = S.cu.get(b.dataset.cuctr);
      if (!d.contract) d.contract = { nr: '', data: todayIso(), ben: { tip: 'PF', nume: d.clientNume }, regim: {} };
      if (c.scop) d.contract.investitie = c.scop; if (c.amplasament) d.contract.amplasament = c.amplasament; if (c.cf) d.contract.cf = c.cf; if (c.nrCad) d.contract.nrCad = c.nrCad;
      d.contract.cu = [c.nr, c.dataEmitere ? L.dataRo(c.dataEmitere) : ''].filter(Boolean).join(' / ');
      renderForm(); scheduleSave(); toast('Datele din CU au fost trecute în contract'); return;
    }
    if (b.dataset.cudel) {
      if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = 'Sigur? Apasă din nou'; return; }
      const c = S.cu.get(b.dataset.cudel); S.cu.delete(c.id); remove('cu', c.id); if (c.fileKey) api('DELETE', 'files/' + encodeURIComponent(c.fileKey)).catch(() => {}); renderCuCard(); updateBadge(); return;
    }
  };
}
async function readCu(c, msg) {
  if (!c?.fileKey) return;
  msg.textContent = 'Citesc certificatul… (10–30 secunde)';
  try {
    const r = await api('POST', 'ai', { prompt: CU_PROMPT, fileKeys: [c.fileKey] });
    ['nr', 'dataEmitere', 'emitent', 'solicitant', 'scop', 'amplasament', 'cf', 'nrCad', 'regim'].forEach((k) => { if (r[k]) c[k] = String(r[k]).trim(); });
    if (L.n(r.valabilitateLuni)) c.valabilitateLuni = L.n(r.valabilitateLuni);
    if (r.dataExpirare) { c.dataExpirare = r.dataExpirare; c._expAuto = false; }
    const have = new Set((c.avize || []).map((a) => norm(a.den)));
    (r.avize || []).forEach((a) => { const den = typeof a === 'string' ? a : a.den; if (den && !have.has(norm(den))) { (c.avize = c.avize || []).push({ den, categorie: a.categorie || '', obtinut: false }); have.add(norm(den)); } });
    S.cu.set(c.id, c); await write('cu', c.id, c); renderCuCard(); updateBadge();
    const m = $('#cuMsg'); if (m) m.textContent = `Am citit CU ${c.nr || ''}: ${(c.avize || []).length} avize/documente cerute. Verifică datele.`;
  } catch (er) { const m = $('#cuMsg'); if (m) m.textContent = 'Nu am putut citi automat: ' + er.message + '. Poți completa manual.'; }
}

/* ---------------- DASHBOARD ---------------- */
function alerts() {
  const out = [];
  S.cu.forEach((c) => {
    const o = S.offers.get(c.offerId); const who = esc(o?.clientNume || 'Client'); const exp = cuExp(c); const d = daysTo(exp); const st = avStat(c);
    if (d != null && d <= 60) out.push({ sev: d <= 30 ? 'bad' : 'warn', rank: d, href: '#o-' + c.offerId, html: `<b>${who}</b> · CU ${esc(c.nr || '')} ${d < 0 ? 'a expirat acum ' + -d + ' zile' : 'expiră în ' + d + ' zile'} (${esc(L.dataRo(exp))})${st.lipsa.length ? ` · încă ${st.lipsa.length} avize lipsă` : ''}` });
    if ((d == null || d > 60) && st.lipsa.length) out.push({ sev: 'info', rank: 500 + st.lipsa.length, href: '#o-' + c.offerId, html: `<b>${who}</b> · ${st.ok} din ${st.tot} avize obținute; lipsesc: ${esc(st.lipsa.slice(0, 3).map((a) => a.den).join(', '))}${st.lipsa.length > 3 ? ' …' : ''}` });
  });
  S.offers.forEach((o) => {
    if (o.status === 'trimisă') { const d = -daysTo(o.data); if (d >= 14) out.push({ sev: 'warn', rank: 200 - Math.min(d, 199), href: '#o-' + o.id, html: `<b>${esc(o.clientNume)}</b> · oferta trimisă acum ${d} zile, fără răspuns (${L.eur(L.totals(o).prestator)})` }); }
  });
  S.clients.forEach((c) => { const s = clientStats(c); if (s.now > 0.5) out.push({ sev: 'warn', rank: 300 - Math.min(s.now / 100, 299), href: '#c-' + c.id, html: `<b>${esc(c.nume)}</b> · de încasat acum ${L.eur(s.now)} (fazele realizate)` }); else if (s.tracked && s.rest > 0.5) out.push({ sev: 'info', rank: 1000 - Math.min(s.rest / 100, 999), href: '#c-' + c.id, html: `<b>${esc(c.nume)}</b> · rest contract ${L.eur(s.rest)} din ${L.eur(s.tracked)}` }); });
  const ord = { bad: 0, warn: 1, info: 2 };
  return out.sort((a, b) => ord[a.sev] - ord[b.sev] || a.rank - b.rank);
}
function updateBadge() { const el = $('#alertBadge'); if (!el || !S.ready) return; const n = alerts().filter((a) => a.sev !== 'info').length; el.innerHTML = n ? `<span class="badge">${n}</span>` : ''; }

  if (k === 'now') {

      '<th>Client / obiectiv</th><th class="n">Valoare</th><th class="n">Realizat</th><th class="n">Exigibil</th><th class="n">Încasat</th><th class="n">De încasat acum</th>',

  }
  if (k === 'cu') {
    const l = [...S.cu.values()].map((c) => ({ c, exp: cuExp(c), st: avStat(c), o: S.offers.get(c.offerId) })).filter((x) => { const d = daysTo(x.exp); return d != null && d <= 60; }).sort((a, b) => (a.exp || '').localeCompare(b.exp || ''));

  }
  return '';
}

/* ---------------- CALITATEA DATELOR (clienți) ---------------- */
const PROJ_RX = /\b(amenaj\w*|locuint\w*|casa|case|hala|hale|pensiune|statie|statii|bloc|apartament\w*|oferta|proiect\w*|birou\w*|vacanta|duplex|anexa|extinder\w*|reabilit\w*|magazin|restaurant|cladire|imobil|bransament|dezafectare|firma luminoasa|biserica|parc|piata|centru|laborator|sat)\b/i;
function clientIssues() {
  const all = [...S.clients.values()]; const locs = new Set(); S.offers.forEach((o) => nameToks(o.localitate || '').forEach((w) => locs.add(w)));
  ['brasov','sanpetru','stupini','sacele','rasnov','harman','codlea','bran','sohodol','pestera','zarnesti','ghimbav','predeal','prejmer','tarlungeni','bunloc','halchiu','feldioara','vulcan','moieciu','poiana','schei','tractoru','cristian','bod'].forEach((w) => locs.add(w));
  const names = all.map((c) => norm(c.nume || '').trim());
  const out = [];
  for (const c of all) {
    if (c.verificat) continue;
    const nm = (c.nume || '').trim(); const nn = norm(nm); const why = [];
    const nOff = [...S.offers.values()].filter((o) => o.clientId === c.id).length; const nPay = [...S.payments.values()].filter((p) => p.clientId === c.id).length;
    if (!nm || /^f[aă]r[aă] nume/i.test(nm) || nm === 'Client nou') why.push('fără nume');
    if (PROJ_RX.test(nn)) why.push('conține denumirea proiectului');
    if (/\d/.test(nm) && !/\b(srl|sa|s\.r\.l)\b/i.test(nm)) why.push('conține cifre');
    if (nm && nm[0] === nm[0].toLowerCase() && /[a-z]/.test(nm[0])) why.push('începe cu literă mică');
    const tk = nameToks(nm); if (tk.length > 1 && locs.has(tk[tk.length - 1])) why.push('conține localitatea');
    if (tk.length === 1 && !/\b(srl|sa)\b/i.test(nm)) why.push('doar un nume');
    if (nn.length >= 2 && names.some((x) => x !== nn && x.startsWith(nn) && x.length > nn.length + 1)) why.push('nume incomplet?');
    if (!nOff && !nPay && !(c.docs || []).length && !c.cadru) why.push('fără oferte (creat accidental?)');
    if (why.length) out.push({ c, why, nOff, nPay, w: why.filter((x) => x !== 'doar un nume').length });
  }
  return out.sort((a, b) => b.w - a.w || norm(a.c.nume).localeCompare(norm(b.c.nume)));
}
function viewCheck() {

  </tbody></table></div>${list.length > 300 ? '<div class="sub">Primele 300.</div>' : ''}`;

  $$('[data-chkok]').forEach((b) => (b.onclick = () => { const c = S.clients.get(b.dataset.chkok); c.verificat = true; write('clients', c.id, c); b.closest('tr').remove(); }));
  $$('[data-chkdel]').forEach((b) => (b.onclick = () => { if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = 'Sigur?'; return; } const id = b.dataset.chkdel; S.clients.delete(id); remove('clients', id); b.closest('tr').remove(); }));
  $$('[data-mergego]').forEach((b) => (b.onclick = async () => { const id = b.dataset.mergego; const v = norm($(`[data-mergeto="${id}"]`).value).trim(); const t = [...S.clients.values()].find((x) => x.id !== id && norm(x.nume).trim() === v); if (!t) { toast('Alege clientul din listă'); return; } if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = 'Sigur? în „' + t.nume + '”'; return; } await mergeClients(t.id, id); b.closest('tr').remove(); }));
}

/* ---------------- DUBLURI CLIENȚI ---------------- */
const DSTOP = new Set(['srl', 'sa', 'sc', 'pfa', 'ii', 'if', 'fam', 'familia', 'dl', 'dna', 'arh', 'ing', 'si', 'de', 'la', 'com', 'impex', 'prod', 'cons', 'trans', 'grup', 'group', 'company', 'construct', 'invest', 'service', 'srl.']);
const nameToks = (n) => norm(n).replace(/s\.?\s?r\.?\s?l\.?/g, ' ').split(/[^a-z0-9]+/).filter((w) => w.length > 2 && !DSTOP.has(w));
function lev(a, b) { if (Math.abs(a.length - b.length) > 2) return 9; const d = Array.from({ length: a.length + 1 }, (_, i) => [i]); for (let j = 1; j <= b.length; j++) d[0][j] = j; for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); return d[a.length][b.length]; }
const PRENUME = new Set('adi adrian alex alexandra alexandru alin alina ana andra andreea andrei anca andrea bogdan catalin catalina claudia claudiu cosmin costin cristi cristian cristina dan dana daniel daniela diana dorin dragos elena emil eugen florin gabi gabriel gabriela george georgiana gheorghe horia ioan ioana ion ionel ionut iulia iulian laura lucian madalina marian maria marius mihaela mihai mircea monica nicolae nicu oana octavian ovidiu paul petru radu raluca razvan roxana sebi sebastian sergiu silviu simona sorin stefan teodor tudor valentin vasile victor vlad'.split(' '));
const tokEq = (x, y) => x === y || (x.length >= 6 && y.length >= 6 && lev(x, y) <= 1);
function sameClient(a, b) {
  const digits = (x) => String(x || '').replace(/\D/g, '');
  if (a.cnp && b.cnp && digits(a.cnp).length >= 6 && digits(a.cnp) === digits(b.cnp)) return 'același CNP/CUI';
  if (a.tel && b.tel && digits(a.tel).slice(-9).length === 9 && digits(a.tel).slice(-9) === digits(b.tel).slice(-9)) return 'același telefon';
  if (a.email && b.email && norm(a.email).trim() === norm(b.email).trim()) return 'același e-mail';
  const ta = nameToks(a.nume || ''), tb = nameToks(b.nume || ''); if (!ta.length || !tb.length) return '';
  const [sm, lg] = ta.length <= tb.length ? [ta, tb] : [tb, ta];
  if (sm.length >= 2 && sm.length === lg.length && sm.every((w) => lg.some((v) => tokEq(w, v)))) return 'nume aproape identic';
  if (sm.every((w) => lg.some((v) => tokEq(w, v))) && sm.some((w) => w.length >= 5 && !PRENUME.has(w))) return sm.length === lg.length ? 'nume aproape identic' : 'nume conținut în celălalt';
  return '';
}
const dupKey = (a, b) => [a, b].sort().join('|');
function findDups(only) {
  const ign = new Set(sett().dupIgnore || []); const cl = [...S.clients.values()]; const out = [];
  for (let i = 0; i < cl.length; i++) for (let j = i + 1; j < cl.length; j++) {
    const a = cl[i], b = cl[j]; if (only && a.id !== only && b.id !== only) continue;
    if (ign.has(dupKey(a.id, b.id))) continue;
    const why = sameClient(a, b); if (why) out.push({ a, b, why });
  }
  return out;
}
function clientWeight(c) { return [...S.offers.values()].filter((o) => o.clientId === c.id).length * 3 + [...S.payments.values()].filter((p) => p.clientId === c.id).length + Object.values(c).filter((v) => v && typeof v === 'string').length / 10; }
async function mergeClients(keepId, dropId) {
  const k = S.clients.get(keepId), d = S.clients.get(dropId); if (!k || !d || keepId === dropId) return;
  for (const [f, v] of Object.entries(d)) { if (['id', 'note', 'docs', 'cadru'].includes(f)) continue; if ((k[f] === undefined || k[f] === '' || k[f] === null) && v !== '' && v != null) k[f] = v; }
  if (d.note && !String(k.note || '').includes(d.note)) k.note = [k.note, d.note].filter(Boolean).join('\n');
  if (norm(d.nume).length > norm(k.nume).length && nameToks(k.nume).every((w) => nameToks(d.nume).some((v) => tokEq(w, v)))) k.nume = d.nume; // păstrează numele complet
  if (d.docs?.length) k.docs = [...(k.docs || []), ...d.docs];
  if (d.cadru && !k.cadru) k.cadru = d.cadru;
  const jobs = [write('clients', k.id, k)];
  S.offers.forEach((o) => { if (o.clientId === dropId || o.clientId === keepId) { if (o.clientId === dropId || o.clientNume !== k.nume) { o.clientId = k.id; o.clientNume = k.nume; jobs.push(write('offers', o.id, o)); } } });
  S.payments.forEach((p) => { if (p.clientId === dropId) { p.clientId = k.id; jobs.push(write('payments', p.id, p)); } });
  S.cu.forEach((u) => { if (u.clientId === dropId) { u.clientId = k.id; jobs.push(write('cu', u.id, u)); } });
  await Promise.all(jobs);
  S.clients.delete(dropId); await remove('clients', dropId);
  toast('Clienții au fost uniți în „' + k.nume + '”');
}
function ignoreDup(a, b) { const ns = clean(S.settings || {}); ns.dupIgnore = [...new Set([...(ns.dupIgnore || []), dupKey(a, b)])]; S.settings = ns; write('settings', 'main', ns); }
function dupCard(list, here) {
  if (!list.length) return '';
  const rowsH = list.slice(0, 30).map(({ a, b, why }) => { const [x, y] = clientWeight(a) >= clientWeight(b) ? [a, b] : [b, a]; const info = (c) => { const n = [...S.offers.values()].filter((o) => o.clientId === c.id).length; const pn = [...S.payments.values()].filter((p) => p.clientId === c.id).length; return `<a href="#c-${c.id}"><b>${esc(c.nume)}</b></a><div class="sub">${esc([c.localitate, n + ' ofert' + (n === 1 ? 'ă' : 'e'), pn ? pn + ' plăți' : ''].filter(Boolean).join(' · '))}</div>`; };
    return `<tr><td>${info(x)}</td><td>${info(y)}</td><td class="sub">${esc(why)}</td><td style="white-space:nowrap"><button class="btn small primary" data-merge="${x.id}|${y.id}">Unește</button> <button class="btn small ghost" data-swap="${x.id}|${y.id}" title="Păstrează-l pe al doilea">↔</button> <button class="btn small ghost" data-nodup="${x.id}|${y.id}">Nu e dublură</button></td></tr>`; }).join('');
  return `<div class="card" style="margin-bottom:14px;border-color:var(--warn,#b7791f)"><div class="hd">${here ? 'Posibilă dublură' : 'Posibile dubluri'} <span class="sub">${list.length}</span></div><div class="bd"><div class="sub" style="margin-bottom:8px">„Unește” mută toate ofertele, contractele, plățile, CU-urile și documentele pe primul client, completează datele lipsă din al doilea și îl șterge pe al doilea. ↔ inversează care rămâne.</div><div class="tablebox"><table class="list"><thead><tr><th>Rămâne</th><th>Se unește în el</th><th>Motiv</th><th></th></tr></thead><tbody>${rowsH}</tbody></table></div></div></div>`;
}
function bindDups(root, after) {
  $$('[data-merge]', root).forEach((b) => (b.onclick = async (e) => { e.stopPropagation(); if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = 'Sigur? Unește'; return; } const [k, d] = b.dataset.merge.split('|'); b.disabled = true; await mergeClients(k, d); after(k); }));
  $$('[data-swap]', root).forEach((b) => (b.onclick = (e) => { e.stopPropagation(); const [k, d] = b.dataset.swap.split('|'); const m = b.parentNode.querySelector('[data-merge]'); m.dataset.merge = d + '|' + k; delete m.dataset.sure; m.textContent = 'Unește'; const tr = b.closest('tr'); tr.insertBefore(tr.cells[1], tr.cells[0]); b.dataset.swap = d + '|' + k; }));
  $$('[data-nodup]', root).forEach((b) => (b.onclick = (e) => { e.stopPropagation(); const [x, y] = b.dataset.nodup.split('|'); ignoreDup(x, y); after(); }));
}

/* ---------------- SORTARE TABELE ---------------- */
function cellVal(td) {
  if (td.dataset.v !== undefined) return parseFloat(td.dataset.v) || 0;
  const t = (td.innerText || '').trim();
  let m = t.match(/^(\d{2})\.(\d{2})\.(\d{4})/); if (m) return +(m[3] + m[2] + m[1]);
  m = t.match(/^(\d+)(?:\/\d+)?\s*(?:din|\/)\s*.*?(\d{4})\b/i); if (m) return +m[2] * 10000 + +m[1];
  const num = t.replace(/[€\s]|lei|mp|%/gi, '').replace(/\./g, '').replace(',', '.');
  if (/^-?\d+(\.\d+)?$/.test(num)) return parseFloat(num);
  return null;
}
document.addEventListener('click', (e) => {
  const th = e.target.closest('table.list thead th'); if (!th) return;
  const table = th.closest('table'); table.dataset.sorted = 1; const idx = [...th.parentNode.children].indexOf(th);
  const dir = th.dataset.dir === 'asc' ? 'desc' : 'asc';
  $$('th', th.parentNode).forEach((x) => { delete x.dataset.dir; x.textContent = x.textContent.replace(/ [▲▼]$/, ''); });
  th.dataset.dir = dir; th.textContent += dir === 'asc' ? ' ▲' : ' ▼';
  sortState = { view: location.hash, idx, dir };
  sortRows(table, idx, dir);
});
let sortState = null;
function sortRows(table, idx, dir) {
  const tb = table.tBodies[0]; if (!tb) return; const rows = [...tb.rows];
  rows.sort((a, b) => {
    const ca = a.cells[idx], cb = b.cells[idx]; if (!ca || !cb) return 0;
    const va = cellVal(ca), vb = cellVal(cb); let r;
    if (va !== null && vb !== null) r = va - vb; else if (va !== null) r = -1; else if (vb !== null) r = 1; else r = norm(ca.innerText).localeCompare(norm(cb.innerText), 'ro');
    return dir === 'asc' ? r : -r;
  });
  rows.forEach((r) => tb.appendChild(r));
}
new MutationObserver(() => {
  if (!sortState || sortState.view !== location.hash) return;
  const table = $('#main table.list'); if (!table || table.dataset.sorted) return;
  const th = table.tHead?.rows[0]?.cells[sortState.idx]; if (!th) return;
  table.dataset.sorted = 1; th.dataset.dir = sortState.dir; th.textContent += sortState.dir === 'asc' ? ' ▲' : ' ▼';
  sortRows(table, sortState.idx, sortState.dir);
}).observe(document.getElementById('main'), { childList: true, subtree: true });

/* ---------------- SITUAȚIE PLĂȚI (PDF prin tipărire) ---------------- */
function printStatement(o) {
  const c = S.clients.get(o.clientId) || {}; const f = fin(o); const pays = [...S.payments.values()].filter((p) => p.offerId === o.id).sort((a, b) => (a.data || '').localeCompare(b.data || ''));
  const ph = phasesOf(o); let cum = 0; let pool = f.paid;
  const rows = ph.map((e) => {
    const start = cum; cum += e.pct; const val = f.due * e.pct / 100;
    const doneFrac = f.pr == null ? 0 : Math.max(0, Math.min(1, (f.pr - start) / e.pct));
    const paidHere = Math.min(val, Math.max(0, pool)); pool -= paidHere;
    const stare = doneFrac >= 0.999 ? 'realizată' : doneFrac > 0 ? 'în lucru' : 'neîncepută';
    const dePlata = doneFrac >= 0.999 ? Math.max(0, val - paidHere) : 0;

  });

  const firma = o.firma === 'arhideea' ? 'SC ATELIER ARHIDEEA SRL · J08/139/2010 · CUI RO26478085' : 'BIA Oprea Cristian Daniel · tel. 0721 242312';
  const e2 = (x) => esc(x);
  const html = `<!doctype html><html lang="ro"><head><meta charset="utf-8"><title>Situatie plati ${e2(c.nume || o.clientNume)}</title>
  <style>@page{size:A4;margin:18mm 16mm}body{font:12px/1.45 "Helvetica Neue",Arial,sans-serif;color:#1b1e21;margin:0}h1{font-size:20px;margin:18px 0 4px}table{width:100%;border-collapse:collapse;margin:10px 0 16px}th,td{border-bottom:1px solid #ccd;padding:6px 6px;text-align:left;vertical-align:top}th{background:#eef0f2;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #1b1e21;padding-bottom:8px}.top img{height:46px}.mut{color:#646b72}.box{display:grid;grid-template-columns:1fr auto;gap:4px 24px;max-width:360px;margin-left:auto;font-size:13px}.box .t{font-weight:700;border-top:1px solid #1b1e21;padding-top:4px}.pill{font-size:10px;padding:1px 6px;border-radius:8px;background:#eef0f2}.ok{background:#ddefe3}.wip{background:#f6ebd7}@media screen{body{max-width:800px;margin:20px auto;padding:0 16px}}</style></head><body>
  <div class="top"><img src="${logo}" alt=""><div class="mut" style="text-align:right">${e2(firma)}<br>Brașov, ${e2(L.dataRo(L.ofertaNoua(sett()).data))}</div></div>
  <h1>Situația plăților</h1>
  <div><b>Beneficiar:</b> ${e2(c.nume || o.clientNume)}<br><b>Proiect:</b> ${e2(o.contract?.investitie || o.obiectiv)}${o.localitate ? ', ' + e2(o.localitate) : ''}<br>
  ${o.contract?.nr ? `<b>Contract:</b> nr. ${e2(o.contract.nr)}${o.contract.data ? ' din ' + e2(L.dataRo(o.contract.data)) : ''}<br>` : ''}${o.anexa ? `<b>Anexa:</b> ${e2(String(o.anexa.nr).padStart(2, '0'))} din ${e2(L.dataRo(o.anexa.data))}<br>` : ''}
  <b>Stadiul proiectului:</b> ${f.pr == null ? '—' : L.fmt(f.pr) + '% realizat'}</div>
  <table><thead><tr><th>Fază</th><th class="n">%</th><th class="n">Valoare</th><th>Stare</th><th class="n">Achitat</th><th class="n">De plată acum</th></tr></thead><tbody>
  ${rows.map((r) => `<tr><td>${e2(r.den)}${r.cond ? `<div class="mut">${e2(r.cond)}</div>` : ''}</td><td class="n">${L.fmt(r.pct)}%</td><td class="n">${L.eur(r.val)}</td><td><span class="pill ${r.stare === 'realizată' ? 'ok' : r.stare === 'în lucru' ? 'wip' : ''}">${r.stare}</span></td><td class="n">${L.eur(r.paidHere)}</td><td class="n"><b>${r.dePlata > 0.5 ? L.eur(r.dePlata) : '—'}</b></td></tr>`).join('')}
  </tbody></table>
  <div class="box"><span>Valoare totală</span><span class="n">${L.eur(f.due)}</span><span>Realizat (${f.pr == null ? '–' : L.fmt(f.pr) + '%'})</span><span class="n">${L.eur(f.earned)}</span><span>Achitat până acum</span><span class="n">${L.eur(f.paid)}</span><span class="t">De plată acum</span><span class="t n">${L.eur(f.now)}</span><span class="mut">Rest până la finalizare</span><span class="n mut">${L.eur(Math.max(0, f.rest))}</span></div>
  ${pays.length ? `<h3 style="margin-top:22px">Plăți înregistrate</h3><table><thead><tr><th>Data</th><th>Factura</th><th class="n">Sumă încasată</th><th class="n">Echivalent EUR</th></tr></thead><tbody>${pays.map((p) => `<tr><td>${e2(L.dataRo(p.data))}</td><td>${e2(p.factura || '')}</td><td class="n">${L.fmt(p.suma, 2)} ${p.moneda === 'RON' ? 'lei' : '€'}</td><td class="n">${L.eur(p.sumaEur)}</td></tr>`).join('')}</tbody></table>` : ''}
  <p class="mut" style="margin-top:18px">Valorile sunt exprimate în EUR, fără TVA. Plata se face în lei, la cursul BNR din ziua emiterii facturii.${o.firma === 'arhideea' ? ' La facturare se adaugă TVA în cota legală, unde este cazul.' : ''}</p>
  <p style="margin-top:28px">Arh. Cristian Oprea</p>

  const w = window.open('', '_blank');

}
